# OP VPS Optimizer - BBR + low latency (VoIP / gaming / streaming)
# Placeholders @CC@ @QDISC@ @MAXBUF@ are filled in by op-optimizer apply

# ---- Congestion control / queueing
net.core.default_qdisc = @QDISC@
net.ipv4.tcp_congestion_control = @CC@
net.ipv4.tcp_pacing_ss_ratio = 200
net.ipv4.tcp_pacing_ca_ratio = 120

# ---- Low latency TCP
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_limit_output_bytes = 262144
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_retries2 = 8
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3

# ---- Buffers (TCP + UDP for voice/game packets)
net.core.rmem_max = @MAXBUF@
net.core.wmem_max = @MAXBUF@
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 65536
net.ipv4.tcp_rmem = 4096 131072 @MAXBUF@
net.ipv4.tcp_wmem = 4096 65536 @MAXBUF@
net.ipv4.udp_rmem_min = 32768
net.ipv4.udp_wmem_min = 32768
net.ipv4.tcp_moderate_rcvbuf = 1

# ---- Packet processing (lower queueing delay)
net.core.netdev_max_backlog = 250000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.busy_poll = 50
net.core.busy_read = 50
net.core.somaxconn = 65535

# ---- Many users
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 2000000
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.ip_local_port_range = 10240 65535

# ---- Conntrack (ignored when module not loaded)
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_tcp_timeout_established = 3600

# ---- System
fs.file-max = 2097152
fs.nr_open = 1048576
vm.swappiness = 10
vm.vfs_cache_pressure = 50
