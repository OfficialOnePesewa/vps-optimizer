# OP VPS Optimizer – Streaming Edition
# High-resolution video + VoIP + low latency
# Placeholders: @CC@  @QDISC@  @MAXBUF@

# ---- Congestion + queueing
net.core.default_qdisc = @QDISC@
net.ipv4.tcp_congestion_control = @CC@
net.ipv4.tcp_pacing_ss_ratio = 200
net.ipv4.tcp_pacing_ca_ratio = 120

# ---- Streaming-friendly TCP
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_limit_output_bytes = 2097152
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_ecn = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_retries2 = 8

# ---- Large buffers for high-res streams
net.core.rmem_max = @MAXBUF@
net.core.wmem_max = @MAXBUF@
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.optmem_max = 131072
net.ipv4.tcp_rmem = 8192 262144 @MAXBUF@
net.ipv4.tcp_wmem = 8192 262144 @MAXBUF@
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_moderate_rcvbuf = 1

# ---- Packet processing (low latency under load)
net.core.netdev_max_backlog = 500000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000
net.core.busy_poll = 50
net.core.busy_read = 50
net.core.somaxconn = 65535
net.core.rps_sock_flow_entries = 65536

# ---- Many concurrent streams / users
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 2000000
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_max_orphans = 262144

# ---- Conntrack (VoIP friendly)
net.netfilter.nf_conntrack_max = 2097152
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 180
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# ---- System
fs.file-max = 4194304
fs.nr_open = 2097152
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
